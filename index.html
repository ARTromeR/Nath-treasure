<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16131a">
<title>Para ti, mi amor</title>

<style>
  :root {
    --paper: #f7f5ee;
    --ink: #25211d;
    --black: #11100f;
    --red: #d7263d;
    --gold: #c9a03c;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding:
      calc(26px + env(safe-area-inset-top))
      calc(14px + env(safe-area-inset-right))
      calc(30px + env(safe-area-inset-bottom))
      calc(14px + env(safe-area-inset-left));
    background:
      radial-gradient(circle at 50% 30%, #3a2f3c 0, #1d1820 62%, #110e13 100%);
    background-attachment: fixed;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
  }

  #projectCard {
    width: min(94vw, 900px);
    filter: drop-shadow(0 22px 34px rgba(0, 0, 0, .45));
  }

  #sheetWrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 65 / 40;
    background: var(--paper);
    transform-origin: center;
    transition: transform 1.4s ease;
  }

  #sheetWrapper.finished {
    transform: scale(1.012);
  }

  #sheet {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--paper);
  }

  /* Mensaje final escrito progresivamente */
  #messagePanel {
    position: relative;
    min-height: 104px;
    display: grid;
    place-items: center;
    padding: 24px 46px 26px;
    background:
      linear-gradient(rgba(247, 245, 238, .97), rgba(247, 245, 238, .97)),
      repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 21px,
        rgba(91, 97, 96, .18) 22px
      );
    border-top: 1px solid rgba(91, 97, 96, .28);
  }

  #messagePanel::before,
  #messagePanel::after {
    content: "♥";
    position: absolute;
    top: 26px;
    color: var(--red);
    font-size: clamp(17px, 2.4vw, 24px);
    opacity: 0;
    transform: scale(.4) rotate(-12deg);
    transition: opacity .55s ease, transform .65s cubic-bezier(.2, .85, .25, 1.35);
  }

  #messagePanel::before {
    left: 17px;
  }

  #messagePanel::after {
    right: 17px;
    transform: scale(.4) rotate(12deg);
  }

  #messagePanel.visible::before,
  #messagePanel.visible::after {
    opacity: .92;
    transform: scale(1) rotate(0);
  }

  #finalMessage {
    min-height: 1.5em;
    max-width: 62ch;
    margin: 0;
    color: var(--ink);
    text-align: center;
    font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
    font-size: clamp(16px, 2.3vw, 21px);
    font-weight: 600;
    line-height: 1.55;
    letter-spacing: .01em;
    text-wrap: pretty;
  }

  #finalMessage::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: .95em;
    margin-left: 4px;
    vertical-align: -.08em;
    background: var(--red);
    opacity: 0;
  }

  #messagePanel.typing #finalMessage::after {
    opacity: 1;
    animation: cursorBlink .72s steps(1) infinite;
  }

  #messagePanel.completed #finalMessage {
    animation: messageSettle .65s ease both;
  }

  /* Pregunta final */
  #question {
    width: 100%;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    text-align: center;
    transition: max-height .8s ease, opacity .8s ease, margin .8s ease;
  }

  #question.show {
    max-height: 320px;
    opacity: 1;
    margin-top: 18px;
  }

  #question p {
    margin: 0 0 14px;
    font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
    font-size: clamp(14px, 1.8vw, 16px);
    font-weight: 600;
    color: #5a4f46;
  }

  #choices {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    min-height: 48px;
  }

  .choice {
    min-width: 92px;
    border: 0;
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  #yesBtn {
    color: #fff;
    background: var(--red);
    box-shadow: 0 6px 16px rgba(215, 38, 61, .35);
    transition: transform .2s ease, box-shadow .2s ease;
  }

  #yesBtn:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 9px 20px rgba(215, 38, 61, .45);
  }

  #noBtn {
    color: #fff;
    background: #2a2528;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .25);
    user-select: none;
    -webkit-user-select: none;
    transition: left .28s cubic-bezier(.2, .9, .3, 1.2), top .28s cubic-bezier(.2, .9, .3, 1.2);
  }

  #noBtn.runaway {
    position: fixed;
    z-index: 20;
    margin: 0;
  }

  #answer {
    display: none;
    margin: 4px 0 0;
    font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
    font-size: clamp(19px, 3vw, 27px);
    font-weight: 700;
    color: var(--red);
  }

  #question.answered #answer {
    display: block;
    animation: pop .7s cubic-bezier(.2, .85, .25, 1.35) both;
  }

  #question.answered {
    max-height: 760px;
  }

  /* Reproductor: cargado desde antes, pero oculto hasta decir que sí. */
  #music {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height .8s ease, opacity .8s ease .2s;
  }

  #question.answered #music {
    max-height: 360px;
    opacity: 1;
  }

  #musicCard {
    width: min(100%, 340px);
    margin: 18px auto 4px;
    padding: 10px;
    border-radius: 14px;
    background: #1d1820;
    box-shadow: 0 10px 24px rgba(0, 0, 0, .28);
  }

  #musicCard .label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 2px 4px 10px;
    color: #f3ecef;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    font-weight: 700;
    text-align: left;
  }

  #musicCard .label small {
    display: block;
    color: #b9aeb4;
    font-weight: 400;
  }

  #musicCard .eq {
    color: var(--red);
    font-size: 18px;
  }

  #playerBox {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }

  #playerBox iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  #question.answered #choices,
  #question.answered p {
    display: none;
  }

  .floatHeart {
    position: fixed;
    z-index: 30;
    pointer-events: none;
    color: var(--red);
    animation: floatUp 2.4s ease-out forwards;
  }

  @keyframes cursorBlink {
    50% { opacity: 0; }
  }

  @keyframes messageSettle {
    from { opacity: .72; transform: translateY(4px); }
    to   { opacity: 1;   transform: translateY(0); }
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(.6); }
    to   { opacity: 1; transform: scale(1); }
  }

  @keyframes floatUp {
    from { opacity: 1; transform: translate(0, 0) scale(.6) rotate(0); }
    to   { opacity: 0; transform: translate(var(--dx), -60vh) scale(1.3) rotate(var(--rot)); }
  }

  #replayBtn {
    margin-top: 18px;
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 999px;
    padding: 10px 17px;
    color: #f3ecef;
    background: rgba(255, 255, 255, .08);
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    transition: transform .2s ease, background .2s ease;
  }

  #replayBtn:hover {
    background: rgba(255, 255, 255, .16);
    transform: translateY(-2px);
  }

  @media (max-width: 600px) {
    body {
      justify-content: flex-start;
      padding:
        env(safe-area-inset-top)
        0
        calc(24px + env(safe-area-inset-bottom))
        0;
    }

    #projectCard {
      width: 100vw;
      filter: none;
    }

    #messagePanel {
      min-height: 94px;
      padding: 20px 36px 22px;
    }

    #messagePanel::before { left: 11px; }
    #messagePanel::after  { right: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    #sheetWrapper, #question, #noBtn { transition: none; }
  }
</style>
</head>

<body>
  <main id="projectCard">
    <div id="sheetWrapper">
      <canvas id="sheet" role="img" aria-label="Pixel art de cinco chicos con chaquetas militares negras, uno con pelo platino en el centro, y un corazón rojo encima"></canvas>
    </div>

    <section id="messagePanel" aria-live="polite" aria-label="Mensaje especial">
      <p id="finalMessage"></p>

      <div id="question" aria-hidden="true">
        <p>¿Estás dispuesta a esperar la sorpresa a mañana?</p>
        <div id="choices">
          <button id="yesBtn" class="choice" type="button">Sí ❤</button>
          <button id="noBtn" class="choice" type="button" tabindex="-1">No</button>
        </div>
        <div id="answer" role="status">Mañana cena usted y yo, mi amor ❤</div>
        <div id="music">
          <div id="musicCard">
            <div class="label">
              <span class="eq">♫</span>
              <span>Summertime<small>My Chemical Romance · Danger Days (2010)</small></span>
            </div>
            <div id="playerBox"><div id="player"></div></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <button id="replayBtn" type="button">▶ Reiniciar dibujo</button>

<script>
(() => {
  "use strict";

  /* ================================================================
     DIBUJO: cada string es una fila y cada carácter una celda.
     B negro · S piel · V piel pálida · Y rubio · P platino
     M castaño oscuro · N castaño · K rizo oscuro · G/g plata
     O/o dorado · W blanco · R rojo · D sombra de ojos · L labios
     . celda vacía
  ================================================================= */
  const ART = [
    "............................BB...BB.......o......................",
    "......................g....BRRB.BRRB.....oOo..............o......",
    ".....o...............gGg...BRWRBRRRB......o..............oOo.....",
    "....oOo...............g....BRRRRRRRB......................o......",
    ".....o......................BRRRRRB...............g..............",
    ".............g...............BRRRB...............gGg.............",
    "............gGg...............BRB.................g..............",
    ".............g.................B.g...............................",
    "................................gGg..............................",
    ".....BBBBB.......................g...................BBBBBBB.....",
    "....BYYYYYB......BBBBB...................BBBBB......BNNNNNNNB....",
    "...BYYYYYYYB....BBBBBBB......BBBBB......BMMMMMB....BNNKNNNKNNB...",
    "...BYYYYYYYB...BBBBBBBBB....BPPPPPB....BMMMMMMMB..BNNNNNKNNNNNB..",
    "...BYYYYYSSB...BBBBBBBBB...BPPPPPPPB...BMMMMMMMB..BNKNNNNNNNKNB..",
    "...BYYSSSSSB...BBBBBBBBB...BPPPPPPPB...BMMMMMMMB..BNNSSSSSSSNNB..",
    "...BSSSSSSSB...BBBBBBSSB...BPPPPPPPB...BMMMMMSSB..BNNSDSSSDSNNB..",
    "...BSBSSSBSB...BSDSSSDSB...BPPVVPVVB...BSDSSSDSB..BNKSBSSSBSKNB..",
    "...BSSSSSSSB...BSBSSSBSB...BVDVVVDVB...BSBSSSBSB..BNNSSSSSSSNNB..",
    "...BSSSLSSSB...BSSSSSSSB...BVBVVVBVB...BSSSSSSSB...BNSSSLSSSNB...",
    "....BSSSSSB....BSSSLSGSB...BVVVVVVVB...BSSSLSSSB...BBNSSSSSNBB...",
    ".....BBBBB......BSSSSSB....BVVVLVVVB....BSSSSSB......BBBBBBB.....",
    "....BBBBBBB......BBBBB......BVVVVVB......BBBBB.......BBBBBBB.....",
    "...BBBBBBBBB....BBBBBBB......BBBBB......BBBBBBB.....BBBBBBBBOB...",
    "..BBBBGBGBBBB..BBBBBBBBB....BBBBBBB....BBBBBBBBB...BBGGOBOGOOB...",
    "..BBBBBBBBBBB.WBWWOBOWWBW..BBBBBBBBGB.BBGGOBOGGBB..BBBBBBBBBOB...",
    "..BBBBGBGBBBB.BBBBBBBBBBB.BBOOOBOOGGB.BBBBBBBBBBB..BBGGOBOGGBB...",
    "..BBBBBBBBBBB.WBWWOBOWWBW.BBBBBBBBBBB.BBGGOBOGGBB..BBBBBBBBBBB...",
    "..BBBBGBGBBBB.BBBBBBBBBBB.BBOOOBOOOGB.BBBBBBBBBBB..BBGGOBOGGBB...",
    "..BBBBBBBBBBB.WBWWOBOWWBW.BBBBBBBBBBB.BBGGOBOGGBB..BBBBBBBBBBB...",
    "..SBBBGBGBBBS.BBBBBBBBBBB.BBOOOBOOOBB.BBBBBBBBBBB..SBGGOBOGGBS...",
    "...BBBBBBBBB..SBWWOBOWWBS.BBVVVVVBBBB.SBGGOBOGGBS...BBBBBBBBB....",
    "...BBBB.BBBB...BBBBBBBBB..BBOVVVVVVBB..BBBBBBBBB....BBBB.BBBB....",
    "....BBB.BBB....BBBB.BBBB...BBBBBBBBB...BBBB.BBBB.....BBB.BBB.....",
    "....BBB.BBB.....WBB.BBW....BBBB.BBBB....BBB.BBB......BBB.BBB.....",
    "....BBB.BBB.....WBB.BBW.....BBB.BBB.....BBB.BBB......BBB.BBB.....",
    "....BBB.BBB.....WBB.BBW.....BBB.BBB.....BBB.BBB......BBB.BBB.....",
    "...BBBB.BBBB....WBB.BBW.....BBB.BBB.....BBB.BBB.....BBBB.BBBB....",
    "...............BBBB.BBBB....BBB.BBB....BBBB.BBBB.................",
    "...........................BBBB.BBBB.............................",
    "................................................................."
  ];

  /* Columna donde empieza cada integrante (de izquierda a derecha). */
  const FIGURE_STARTS = [2, 14, 26, 38, 50];
  /* Filas por encima de esta son el corazón y las chispas. */
  const DECOR_ROWS = 9;

  const ROWS = ART.length;
  const COLS = ART[0].length;

  if (!ART.every(row => row.length === COLS)) {
    throw new Error("Todas las filas de ART deben tener la misma longitud");
  }

  const COLORS = {
    B: "#11100f",
    S: "#f1c7a5",
    V: "#f9e6da",
    Y: "#e0b44c",
    P: "#e6e1d2",
    M: "#3b2618",
    N: "#6b4226",
    K: "#43281a",
    G: "#9ea3a8",
    g: "#c9ccd0",
    O: "#c9a03c",
    o: "#e6cf8a",
    W: "#ffffff",
    R: "#d7263d",
    D: "#7a2a3a",
    L: "#c97a7a"
  };

  /* Tono de las vetas de rotulador para cada color. */
  const STREAK = {
    R: "#7b1222",
    D: "#3d0e18",
    W: "#9a958a",
    S: "#b7856a",
    V: "#c9a796",
    Y: "#9c7425",
    P: "#a29c8a",
    O: "#7d5f1a",
    o: "#a38c45",
    G: "#5d6166",
    g: "#8a8d91"
  };

  const canvas = document.getElementById("sheet");
  const ctx = canvas.getContext("2d", { alpha: false });
  const wrapper = document.getElementById("sheetWrapper");
  const replayBtn = document.getElementById("replayBtn");
  const messagePanel = document.getElementById("messagePanel");
  const finalMessage = document.getElementById("finalMessage");
  const question = document.getElementById("question");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");

  const MESSAGE = "Tranquila, mi amor, sé que te encanta Gerard, pero este regalo no va de eso: va de sorprenderte con algo que espero que te guste. Este no es el único regalo que tengo para ti, y ojalá estar una vida entera llenándote de amor y fijándome en cada uno de los pequeños detalles que te llenan de felicidad. ❤";

  /* Duración aproximada del dibujo, en milisegundos. */
  const DRAW_TIME = 9000;

  let animationId = 0;
  let cells = [];
  let cellSize = 12;

  wrapper.style.aspectRatio = `${COLS} / ${ROWS}`;

  /* Generador pseudoaleatorio estable:
     la irregularidad siempre queda igual para cada celda. */
  function seededRandom(seed) {
    const value = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
    return value - Math.floor(value);
  }

  function resizeCanvas() {
    const rect = wrapper.getBoundingClientRect();
    const cssWidth = rect.width;
    const cssHeight = cssWidth * ROWS / COLS;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cellSize = cssWidth / COLS;

    drawGrid();
    drawAllPaintedCells();
  }

  function drawGrid() {
    const width = cellSize * COLS;
    const height = cellSize * ROWS;

    ctx.save();
    ctx.clearRect(0, 0, width, height);

    /* Papel cálido */
    ctx.fillStyle = "#f7f5ee";
    ctx.fillRect(0, 0, width, height);

    /* Textura muy sutil de papel */
    for (let i = 0; i < 1800; i++) {
      const x = seededRandom(i + 11) * width;
      const y = seededRandom(i + 713) * height;
      const opacity = .018 + seededRandom(i + 37) * .022;
      ctx.fillStyle = `rgba(95, 84, 68, ${opacity})`;
      ctx.fillRect(x, y, .55, .55);
    }

    /* Líneas de cuadrícula */
    ctx.strokeStyle = "rgba(91, 97, 96, .42)";
    ctx.lineWidth = Math.max(.5, cellSize * .045);

    for (let x = 0; x <= COLS; x++) {
      const px = x * cellSize;
      ctx.beginPath();
      ctx.moveTo(px, 0);
      ctx.lineTo(px, height);
      ctx.stroke();
    }

    for (let y = 0; y <= ROWS; y++) {
      const py = y * cellSize;
      ctx.beginPath();
      ctx.moveTo(0, py);
      ctx.lineTo(width, py);
      ctx.stroke();
    }

    ctx.restore();
  }

  function figureOf(x) {
    let figure = 0;
    FIGURE_STARTS.forEach((start, i) => {
      if (x >= start) figure = i;
    });
    return figure;
  }

  function buildCells() {
    const list = [];

    ART.forEach((row, y) => {
      [...row].forEach((value, x) => {
        if (value === "." || !COLORS[value]) return;

        const decor = y < DECOR_ROWS || value === "g" || value === "o";
        /* Cada integrante se dibuja por turnos: primero el contorno negro
           y luego los colores. El corazón y las chispas van al final. */
        const group = decor ? FIGURE_STARTS.length : figureOf(x);
        const layer = value === "B" ? 0 : 1;
        list.push({ x, y, value, group, layer });
      });
    });

    list.sort((a, b) =>
      a.group - b.group || a.layer - b.layer || a.y - b.y || a.x - b.x
    );

    cells = list.map((cell, index) => ({ ...cell, index, painted: false }));
  }

  function paintCell(cell) {
    const { x, y, value } = cell;
    const left = x * cellSize;
    const top = y * cellSize;

    /* Pequeño desbordamiento para unir los cuadros como un marcador real. */
    const bleed = Math.max(.2, cellSize * .025);

    const j1 = (seededRandom(x * 101 + y * 17 + 1) - .5) * cellSize * .07;
    const j2 = (seededRandom(x * 83 + y * 29 + 2) - .5) * cellSize * .07;
    const j3 = (seededRandom(x * 59 + y * 43 + 3) - .5) * cellSize * .07;
    const j4 = (seededRandom(x * 37 + y * 71 + 4) - .5) * cellSize * .07;

    ctx.save();
    ctx.globalAlpha = value === "B" ? .985 : .96;
    ctx.fillStyle = COLORS[value];

    ctx.beginPath();
    ctx.moveTo(left - bleed + j1, top - bleed + j2);
    ctx.lineTo(left + cellSize + bleed + j2, top - bleed + j3);
    ctx.lineTo(left + cellSize + bleed + j3, top + cellSize + bleed + j4);
    ctx.lineTo(left - bleed + j4, top + cellSize + bleed + j1);
    ctx.closePath();
    ctx.fill();

    /* Vetas de rotulador: apenas visibles, para evitar un acabado digital plano. */
    ctx.globalAlpha = value === "B" ? .045 : .09;
    ctx.strokeStyle = STREAK[value] || "#6d6258";
    ctx.lineWidth = Math.max(.4, cellSize * .025);

    for (let stripe = 0; stripe < 3; stripe++) {
      const offset = cellSize * (.24 + stripe * .25);
      const wave = (seededRandom(x * 211 + y * 97 + stripe) - .5) * 1.4;
      ctx.beginPath();
      ctx.moveTo(left, top + offset + wave);
      ctx.lineTo(left + cellSize, top + offset - wave);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawAllPaintedCells() {
    cells.forEach(cell => {
      if (cell.painted) paintCell(cell);
    });
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function scrollToBottomOf(element) {
    element.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  async function typeMessage(myAnimation) {
    finalMessage.textContent = "";
    messagePanel.classList.remove("visible", "completed");
    messagePanel.classList.add("typing");

    await sleep(180);
    if (myAnimation !== animationId) return;

    messagePanel.classList.add("visible");
    scrollToBottomOf(messagePanel);

    const chars = [...MESSAGE];
    let lastScroll = 0;

    for (let i = 0; i < chars.length; i++) {
      if (myAnimation !== animationId) return;

      finalMessage.textContent += chars[i];

      /* Mientras el panel crece, mantenerlo a la vista. */
      if (i - lastScroll > 40) {
        lastScroll = i;
        scrollToBottomOf(messagePanel);
      }

      /* Pausas algo mayores después de espacios y signos,
         para un ritmo de escritura más natural (~17 s en total). */
      const char = chars[i];
      let pause = 34 + seededRandom(i + 2100) * 22;
      if (char === " ") pause = 52;
      if (",.:".includes(char)) pause = 260;
      await sleep(pause);
    }

    if (myAnimation !== animationId) return;

    messagePanel.classList.remove("typing");
    messagePanel.classList.add("completed");

    await sleep(700);
    if (myAnimation !== animationId) return;
    showQuestion();
  }

  /* ================== Canción ==================
     "Summertime" desde el segundo 25 con el reproductor de YouTube.
     Se carga al aparecer la pregunta para que, al pulsar "Sí",
     playVideo() se ejecute dentro del mismo toque (necesario en iPhone). */

  /* Visualizer oficial de la banda (se deja incrustar); de respaldo, el audio oficial. */
  const SONG_IDS = ["oj1q7iQ1v2s", "LW7FxWXt3ok"];
  const SONG_START = 25;

  let player = null;
  let playerReady = false;
  let wantsMusic = false;
  let songIndex = 0;
  let startedOnce = false;

  function loadPlayer() {
    if (player) return;
    if (window.YT && window.YT.Player) {
      createPlayer();
      return;
    }
    if (document.getElementById("ytApi")) return;
    window.onYouTubeIframeAPIReady = createPlayer;
    const script = document.createElement("script");
    script.id = "ytApi";
    script.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(script);
  }

  function createPlayer() {
    if (player) return;
    player = new YT.Player("player", {
      videoId: SONG_IDS[songIndex],
      host: "https://www.youtube-nocookie.com",
      playerVars: {
        start: SONG_START,
        playsinline: 1,
        rel: 0,
        modestbranding: 1
      },
      events: {
        onReady: () => {
          playerReady = true;
          if (wantsMusic) playSong();
        },
        onStateChange: event => {
          /* Si ella le da play a mano desde el principio, saltar al 25. */
          if (event.data === YT.PlayerState.PLAYING && !startedOnce) {
            startedOnce = true;
            if (player.getCurrentTime() < SONG_START - 2) player.seekTo(SONG_START, true);
          }
        },
        onError: () => {
          /* Si un video no se deja incrustar, probar con el otro. */
          if (songIndex + 1 < SONG_IDS.length) {
            songIndex++;
            player.loadVideoById({ videoId: SONG_IDS[songIndex], startSeconds: SONG_START });
          }
        }
      }
    });
  }

  function playSong() {
    wantsMusic = true;
    if (!playerReady) {
      loadPlayer();
      return;
    }
    player.seekTo(SONG_START, true);
    player.unMute();
    player.setVolume(100);
    player.playVideo();
  }

  function stopSong() {
    wantsMusic = false;
    startedOnce = false;
    if (playerReady) player.pauseVideo();
  }

  /* ================== Pregunta final ================== */

  function showQuestion() {
    question.classList.add("show");
    question.setAttribute("aria-hidden", "false");
    loadPlayer();
    setTimeout(() => scrollToBottomOf(question), 450);
  }

  function resetQuestion() {
    question.classList.remove("show", "answered");
    stopSong();
    question.setAttribute("aria-hidden", "true");
    noBtn.classList.remove("runaway");
    document.getElementById("noSpacer")?.remove();
    document.getElementById("choices").appendChild(noBtn);
    noBtn.style.left = "";
    noBtn.style.top = "";
    noBtn.style.display = "";
  }

  function overlaps(a, b, pad) {
    return !(
      a.right + pad < b.left ||
      a.left - pad > b.right ||
      a.bottom + pad < b.top ||
      a.top - pad > b.bottom
    );
  }

  /* El botón "No" huye a un lugar aleatorio de la pantalla,
     lejos de donde estaba y sin tapar el botón "Sí". */
  function runAway(pointerX, pointerY) {
    if (question.classList.contains("answered")) return;

    const rect = noBtn.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    const margin = 12;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const yesRect = yesBtn.getBoundingClientRect();

    if (!noBtn.classList.contains("runaway")) {
      noBtn.style.left = rect.left + "px";
      noBtn.style.top = rect.top + "px";
      /* Hueco invisible para que el botón "Sí" no se mueva de sitio. */
      const spacer = document.createElement("span");
      spacer.id = "noSpacer";
      spacer.style.cssText = `display:inline-block;width:${w}px;height:${h}px`;
      noBtn.after(spacer);
      /* Se mueve al body para que ningún contenedor lo recorte. */
      document.body.appendChild(noBtn);
      noBtn.classList.add("runaway");
      /* Forzar el estilo inicial para que la transición se vea. */
      void noBtn.offsetWidth;
    }

    const px = pointerX ?? rect.left + w / 2;
    const py = pointerY ?? rect.top + h / 2;

    let best = null;
    for (let tries = 0; tries < 40; tries++) {
      const left = margin + Math.random() * Math.max(1, vw - w - margin * 2);
      const top = margin + Math.random() * Math.max(1, vh - h - margin * 2);
      const candidate = { left, top, right: left + w, bottom: top + h };
      const distance = Math.hypot(left + w / 2 - px, top + h / 2 - py);

      if (overlaps(candidate, yesRect, 16)) continue;
      if (!best || distance > best.distance) best = { left, top, distance };
      if (distance > Math.min(vw, vh) * .45) break;
    }

    if (best) {
      noBtn.style.left = best.left + "px";
      noBtn.style.top = best.top + "px";
    }
  }

  function dodge(event) {
    event.preventDefault();
    event.stopPropagation();
    const point = event.touches ? event.touches[0] : event;
    runAway(point && point.clientX, point && point.clientY);
  }

  noBtn.addEventListener("mouseenter", dodge);
  noBtn.addEventListener("pointerdown", dodge);
  noBtn.addEventListener("touchstart", dodge, { passive: false });
  noBtn.addEventListener("click", dodge);
  noBtn.addEventListener("focus", () => {
    noBtn.blur();
    runAway();
  });
  noBtn.addEventListener("keydown", dodge);
  noBtn.addEventListener("contextmenu", dodge);

  /* Si el cursor se acerca demasiado, también huye. */
  document.addEventListener("pointermove", event => {
    if (event.pointerType !== "mouse") return;
    if (!question.classList.contains("show")) return;
    const rect = noBtn.getBoundingClientRect();
    const near = 36;
    if (
      event.clientX > rect.left - near && event.clientX < rect.right + near &&
      event.clientY > rect.top - near && event.clientY < rect.bottom + near
    ) {
      runAway(event.clientX, event.clientY);
    }
  });

  window.addEventListener("resize", () => {
    if (noBtn.classList.contains("runaway")) runAway();
  });

  function heartBurst() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const rect = yesBtn.getBoundingClientRect();
    for (let i = 0; i < 26; i++) {
      const heart = document.createElement("span");
      heart.className = "floatHeart";
      heart.textContent = "♥";
      heart.style.left = rect.left + rect.width / 2 + (Math.random() - .5) * 120 + "px";
      heart.style.top = rect.top + (Math.random() - .5) * 30 + "px";
      heart.style.fontSize = 14 + Math.random() * 22 + "px";
      heart.style.setProperty("--dx", (Math.random() - .5) * 220 + "px");
      heart.style.setProperty("--rot", (Math.random() - .5) * 90 + "deg");
      heart.style.animationDelay = Math.random() * .5 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 3200);
    }
  }

  yesBtn.addEventListener("click", () => {
    playSong();
    heartBurst();
    noBtn.style.display = "none";
    document.getElementById("noSpacer")?.remove();
    question.classList.add("answered");
    setTimeout(() => scrollToBottomOf(question), 100);
    setTimeout(() => scrollToBottomOf(question), 900);
  });

  /* ================== Animación ================== */

  function resetMessage() {
    finalMessage.textContent = "";
    messagePanel.classList.remove("visible", "typing", "completed");
    resetQuestion();
  }

  async function animate() {
    const myAnimation = ++animationId;

    wrapper.classList.remove("finished");
    resetMessage();
    buildCells();
    drawGrid();

    /* Pausa inicial corta para ver la hoja. */
    await sleep(260);

    /* Se pintan varias celdas por cuadro para que el dibujo dure ~9 s. */
    const tick = 16;
    const perTick = Math.max(1, Math.ceil(cells.length / (DRAW_TIME / tick)));

    for (let i = 0; i < cells.length; i += perTick) {
      if (myAnimation !== animationId) return;

      for (let k = i; k < Math.min(i + perTick, cells.length); k++) {
        cells[k].painted = true;
        paintCell(cells[k]);
      }

      /* Pequeña variación para que parezca dibujado a mano. */
      await sleep(tick + seededRandom(i + 900) * 6);
    }

    if (myAnimation !== animationId) return;

    await sleep(550);
    wrapper.classList.add("finished");

    await sleep(300);
    if (myAnimation !== animationId) return;
    await typeMessage(myAnimation);
  }

  replayBtn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
    animate();
  });

  window.addEventListener("resize", resizeCanvas);

  buildCells();
  resizeCanvas();

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduceMotion) {
    cells.forEach(cell => cell.painted = true);
    drawGrid();
    drawAllPaintedCells();
    finalMessage.textContent = MESSAGE;
    messagePanel.classList.add("visible", "completed");
    showQuestion();
  } else {
    animate();
  }
})();
</script>
</body>
</html>
